  </defs>
  <rect width="1280" height="520" fill="url(#bgGrad)"/>
  <circle cx="1120" cy="110" r="260" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="980" cy="440" r="190" fill="#ffffff" fill-opacity="0.06"/>

