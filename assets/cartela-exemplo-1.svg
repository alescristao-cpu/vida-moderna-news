  <text x="70" y="165" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="58" fill="#ffffff">Comunicação inteligente</text>
  <text x="70" y="232" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="44" fill="#bbf7d0">no Modern Life Residence!</text>

  <!-- Product / Offer highlights -->
